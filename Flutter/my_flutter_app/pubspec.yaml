name: my_flutter_app
description: EmergencyIQ Flutter client for voice + text emergency reports.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  record: ^6.0.0
  speech_to_text: ^7.0.0
  connectivity_plus: ^6.0.5
  network_info_plus: ^6.0.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # Keep Android build green if transitive Linux stubs drift.
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
